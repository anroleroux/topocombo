name: mesh + report

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish so a half-built site is
# never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # gmsh ships a shared library that links against GLU even in headless use.
      - name: Install system libraries for gmsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install topocombo
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      # Three example studies, each a CadQuery part with named regions plus a
      # study script; the reports print both.  The cantilever (hexahedra,
      # clamped) is the main page; the bracket (not a prism: quadratic
      # tetrahedra, two load cases, passive solid rings) is at bracket/; the
      # half MBB beam (symmetry and roller supports) is at mbb/.
      - name: Run the pipeline and render the reports
        run: |
          python -m topocombo.cli all --study examples/cantilever/study.py \
            --out results/cantilever --site site \
            --nav "bracket (tet10)=bracket/" --nav "MBB beam (symmetry)=mbb/"
          python -m topocombo.cli all --study examples/bracket/study.py \
            --out results/bracket --site site/bracket \
            --nav "cantilever (hex8)=../" --nav "MBB beam (symmetry)=../mbb/"
          python -m topocombo.cli all --study examples/mbb/study.py \
            --out results/mbb --site site/mbb \
            --nav "cantilever (hex8)=../" --nav "bracket (tet10)=../bracket/"

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: example-runs
          path: results
          if-no-files-found: error

      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
